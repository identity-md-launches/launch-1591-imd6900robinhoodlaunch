# IMD6900 on Robinhood Chain: the coin, its locked v4 pool and perps hook, launched by the IMD swarm, stamped on Programmable.
# offline: every library is vendored under lib/ (only what is imported). bytecode_hash = "none", as IMD's launches
# require.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.26"
bytecode_hash = "none"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = [
    "solady/=lib/solady/src/",
    "@uniswap/v4-core/=lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "forge-std/=lib/forge-std/src/",
    "solmate/=lib/solmate/",
    "v4-core/=lib/v4-core/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
